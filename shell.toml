# Lunar Blue shell surfaces: quiet graphite, vivid blue focus states,
# crisp interaction feedback, and fine one-pixel borders.

[bar]
background       = "#121316"
background-alpha = 1.0
text             = "#e8edf5"
active           = "#8ec5ff"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border            = "rgb(8ec5ff)"
active-border-foreground = "rgb(8ec5ff)"

[controls]
normal-color        = "#e8edf5"
normal-fill-alpha   = 0.03
normal-border       = "#818b9d"
normal-border-width = 1
normal-border-alpha = 0.28

hover-cursor-color        = "#f4f8ff"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#8ec5ff"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.35

focus-color        = "#f4f8ff"
focus-fill-alpha   = 0.15
focus-border       = "#8ec5ff"
focus-border-width = 1
focus-border-alpha = 0.62

selected-color        = "#f4f8ff"
selected-fill-alpha   = 0.20
selected-border       = "#8ec5ff"
selected-border-width = 1
selected-border-alpha = 0.42

pressed-fill-alpha   = 0.24
selection-fill-alpha = 0.38

[spacing]
scale           = 0.96
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#121316"
background-alpha = 1.0
text             = "#e8edf5"
border           = "hyprland.active-border"
border-alpha     = 0.48
border-width     = 1

[tooltip]
background       = "#121316"
background-alpha = 1.0
text             = "#e8edf5"
border           = "#818b9d"
border-alpha     = 0.38

[notifications]
background       = "#121316"
background-alpha = 1.0
text             = "#e8edf5"
border           = "hyprland.active-border"
border-alpha     = 0.55
border-width     = 1
countdown        = "#8ec5ff"

[launcher]
background                = "#121316"
background-alpha          = 1.0
text                      = "#e8edf5"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#0d0d0f"
scrim-alpha               = 0.58
selected-background       = "#1348dc"
selected-background-alpha = 0.40
selected-text             = "#f4f8ff"
selected-border           = "#8ec5ff"
selected-border-alpha     = 0.72

[menu]
background                = "#121316"
background-alpha          = 1.0
text                      = "#e8edf5"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#0d0d0f"
scrim-alpha               = 0.54
selected-background       = "#1348dc"
selected-background-alpha = 0.40
selected-text             = "#f4f8ff"
selected-border           = "#8ec5ff"
selected-border-alpha     = 0.72

[polkit]
background       = "#121316"
background-alpha = 1.0
text             = "#e8edf5"
text-error       = "#ff7b8e"
border           = "hyprland.active-border"
border-error     = "#ff7b8e"
border-alpha     = 0.58
scrim            = "#0d0d0f"
scrim-alpha      = 0.62
accent           = "#8ec5ff"

[lock]
background       = "#121316"
background-alpha = 0.84
text             = "#e8edf5"
placeholder      = "#818b9d"
text-error       = "#ff7b8e"
border           = "#818b9d"
border-active    = "hyprland.active-border"
border-error     = "#ff7b8e"
border-alpha     = 0.62
selection        = "#1348dc"
selection-alpha  = 0.65

[image-picker]
scrim                   = "#0d0d0f"
scrim-alpha             = 0.62
text                    = "#e8edf5"
selected-border         = "#8ec5ff"
selected-border-alpha   = 0.92
unselected-border       = "#818b9d"
unselected-border-alpha = 0.24
